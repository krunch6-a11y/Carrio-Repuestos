<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;background:#0f0f1a;color:#e0e0f0;min-height:100vh}
header{background:linear-gradient(135deg,#1a1a3e,#2d2d6b);padding:16px 20px;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,.5)}
.logo{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.li{width:40px;height:40px;background:linear-gradient(135deg,#f5a623,#e8842a);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
h1{font-size:1.25rem;font-weight:700;color:#fff}
.sub{font-size:.7rem;color:#9090c0}
.sw{position:relative}
#si{width:100%;padding:12px 48px 12px 16px;border-radius:12px;border:2px solid #3a3a6a;background:#1e1e40;color:#e0e0f0;font-size:1rem;outline:none;transition:border-color .2s}
#si:focus{border-color:#f5a623}
#si::placeholder{color:#6060a0}
#cb{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:#9090c0;cursor:pointer;font-size:1.1rem;display:none;padding:4px}
.vs{display:block}
#chips{display:flex;gap:8px;overflow-x:auto;padding:12px 20px 4px;scrollbar-width:none}
#chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;padding:6px 14px;border-radius:20px;border:1.5px solid #3a3a6a;background:#1e1e40;color:#9090c0;font-size:.78rem;cursor:pointer;white-space:nowrap}
.chip.active{background:#f5a623;border-color:#f5a623;color:#1a1a2e;font-weight:600}
#hb{padding:4px 20px 8px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;min-height:36px}
#hb::-webkit-scrollbar{display:none}
.hc{flex-shrink:0;padding:4px 12px;border-radius:14px;background:#252545;border:1px solid #3a3a5a;color:#8080b0;font-size:.75rem;cursor:pointer}
main{padding:12px 20px 100px}
.ib{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-size:.8rem;color:#6060a0}
#rc{color:#f5a623;font-weight:600}
.ub{font-size:.65rem;color:#6060a0}
.fb{margin-bottom:16px;border-radius:12px;overflow:hidden;border:1px solid #2a2a50}
.fh{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:#1a1a3a;cursor:pointer;user-select:none}
.fn{font-size:.88rem;font-weight:600;color:#c0c0e8}
.fc{font-size:.75rem;color:#f5a623;background:#2a2040;padding:2px 8px;border-radius:10px}
.fa{color:#6060a0;font-size:.8rem;transition:transform .2s}
.fb.open .fa{transform:rotate(180deg)}
.fbd{display:none}
.fb.open .fbd{display:block}
.item{display:grid;grid-template-columns:1fr auto;gap:8px;padding:12px 16px;border-top:1px solid #1e1e3a;align-items:start}
.item:hover{background:#1a1a35}
.ir{font-family:Courier New,monospace;font-size:.85rem;font-weight:700;color:#f5a623;word-break:break-all}
.id{font-size:.82rem;color:#c0c0d8;margin-top:4px;line-height:1.4}
.is{font-size:.75rem;padding:2px 8px;border-radius:8px;white-space:nowrap;margin-top:4px;display:inline-block}
.sok{background:#1a3a2a;color:#4caf80;border:1px solid #2a5a3a}
.sz{background:#2a2030;color:#8070a0;border:1px solid #3a2a50}
.acts{display:flex;gap:6px;margin-top:6px}
.bc{padding:4px 10px;border-radius:6px;font-size:.72rem;border:none;cursor:pointer;background:#2a2a5a;color:#9090d0}
.bw{padding:4px 10px;border-radius:6px;font-size:.72rem;border:none;cursor:pointer;background:#1a4a2a;color:#4caf80}
.bfav{background:none;border:none;cursor:pointer;font-size:1.1rem;padding:2px}
mark{background:#f5a62333;color:#f5d080;border-radius:3px;padding:0 2px}
.empty{text-align:center;padding:60px 20px;color:#5050a0}
.ei{font-size:3rem;margin-bottom:12px}
.hint{font-size:.8rem;color:#4040a0;margin-top:6px}
.fab{position:fixed;bottom:24px;right:20px;z-index:200}
.fabb{width:52px;height:52px;border-radius:50%;border:none;cursor:pointer;font-size:1.3rem;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(0,0,0,.4);background:linear-gradient(135deg,#f5a623,#e8842a);color:#fff}
.fp{position:fixed;bottom:0;left:0;right:0;background:#12122a;border-top:2px solid #2a2a5a;padding:20px;max-height:60vh;overflow-y:auto;display:none;z-index:300}
.fp.open{display:block}
.fph{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.fpt{font-weight:700;color:#f5a623}
.fpc{background:none;border:none;color:#9090c0;cursor:pointer;font-size:1.2rem}
.toast{position:fixed;top:80px;left:50%;transform:translateX(-50%);background:#2a4a2a;color:#4caf80;padding:8px 20px;border-radius:20px;font-size:.85rem;display:none;z-index:400;border:1px solid #3a6a3a}
.toast.show{display:block}
</style>
</head>

function esc(s){var d=document.createElement("div");d.appendChild(document.createTextNode(s));return d.innerHTML;}
function hl(text,q){
  if(!q)return esc(text);
  var out="",lc=text.toLowerCase(),lq=q.toLowerCase(),i=0;
  while(i<text.length){
    var idx=lc.indexOf(lq,i);
    if(idx===-1){out+=esc(text.slice(i));break;}
    out+=esc(text.slice(i,idx))+"<mark>"+esc(text.slice(idx,idx+q.length))+"</mark>";
    i=idx+q.length;
  }
  return out;
}

function copyRef(i){var item=DATA[i];if(navigator.clipboard){navigator.clipboard.writeText(item.ref).then(function(){toast("Copiado: "+item.ref);});}else{toast(item.ref);}}
function shareWA(i){var item=DATA[i];var msg=encodeURIComponent("Carrio Repuestos\nRef: "+item.ref+"\n"+item.desc);window.open("https://api.whatsapp.com/send?text="+msg,"_blank");}
function toggleFav(i){var item=DATA[i];if(isFav(item.ref)){favs=favs.filter(function(f){return f.r!==item.ref;});}else{favs.push({r:item.ref,d:item.desc});}sf();render(curQ,activeFamily);renderFavPanel();}
var activeFamily="",curQ="";
function buildChips(fams){
  var el=document.getElementById("chips");el.innerHTML="";
  function makeChip(label,fam){
    var btn=document.createElement("button");
    btn.className="chip"+(activeFamily===fam?" active":"");
    btn.textContent=label;
    btn.onclick=function(){activeFamily=fam;buildChips(fams);render(curQ,fam);};
    el.appendChild(btn);
  }
  makeChip("Todas","");
  fams.forEach(function(f){makeChip(f,f);});
}
function renderHist(){
  var bar=document.getElementById("hb");bar.innerHTML="";
  hist.slice(0,10).forEach(function(q){
    var btn=document.createElement("button");btn.className="hc";btn.textContent=q;
    btn.onclick=function(){document.getElementById("si").value=q;doSearch(q);};
    bar.appendChild(btn);
  });
}
function renderFavPanel(){
  var list=document.getElementById("fl");
  if(favs.length===0){list.innerHTML="<div class=\"empty\" style=\"padding:20px 0\"><div class=\"ei\">&#9734;</div><div>Sin favoritos</div></div>";return;}
  var html="";
  favs.forEach(function(f){
    var i=DATA.findIndex(function(d){return d.ref===f.r;});
    html+="<div class=\"item\"><div><div class=\"ir\">"+esc(f.r)+"</div><div class=\"id\">"+esc(f.d)+"</div><div class=\"acts\"><button class=\"bc\" onclick=\"copyRef("+i+")\">&#128203; Copiar</button></div></div><button class=\"bfav\" onclick=\"toggleFav("+i+")\">&#11088;</button></div>";
  });
  list.innerHTML=html;
}
function render(query,family){
  curQ=query;
  var q=query.trim().toLowerCase(),MIN=3;
  var res=document.getElementById("results"),info=document.getElementById("rc");
  if(q.length>0&&q.length<MIN){res.innerHTML="<div class=\"empty\"><div class=\"ei\">&#128269;</div><div>Escribe al menos "+MIN+" caracteres</div></div>";info.textContent="";return;}
  var indices=[];
  for(var i=0;i<DATA.length;i++){
    var d=DATA[i];
    if(q&&d.ref.toLowerCase().indexOf(q)<0&&d.desc.toLowerCase().indexOf(q)<0)continue;
    if(family&&d.familia!==family)continue;
    indices.push(i);
  }
  if(indices.length===0){res.innerHTML="<div class=\"empty\"><div class=\"ei\">&#129335;</div><div>Sin resultados</div><div class=\"hint\">Prueba con otra referencia o descripci&#243;n</div></div>";info.textContent="Sin resultados";return;}
  var groups={};
  indices.forEach(function(i){var f=DATA[i].familia;if(!groups[f])groups[f]=[];groups[f].push(i);});
  var fkeys=Object.keys(groups).sort();
  info.textContent=indices.length+" resultado"+(indices.length!==1?"s":"");
  var qShow=q.length>=MIN?query.trim():"";
  var html="";
  fkeys.forEach(function(fam){
    var list=groups[fam];
    html+="<div class=\"fb open\">";
    html+="<div class=\"fh\" onclick=\"this.parentElement.classList.toggle('open')\"><span class=\"fn\">"+esc(fam)+"</span><span><span class=\"fc\">"+list.length+"</span> <span class=\"fa\">&#9660;</span></span></div>";
    html+="<div class=\"fbd\">";
    list.forEach(function(idx){
      var item=DATA[idx];
      var sn=parseFloat(item.stock);
      var sb=item.stock!==""?"<span class=\"is "+(sn>0?"sok":"sz")+"\">&nbsp;Stock:&nbsp;"+esc(item.stock)+"&nbsp;</span>":"";
      var star=isFav(item.ref)?"&#11088;":"&#9734;";
      html+="<div class=\"item\">";
      html+="<div><div class=\"ir\">"+hl(item.ref,qShow)+"</div>";
      html+="<div class=\"id\">"+hl(item.desc,qShow)+"</div>";
      html+=sb;
      html+="<div class=\"acts\"><button class=\"bc\" onclick=\"copyRef("+idx+")\">&#128203; Copiar</button><button class=\"bw\" onclick=\"shareWA("+idx+")\">&#128994; WhatsApp</button></div>";
      html+="</div><button class=\"bfav\" onclick=\"toggleFav("+idx+")\">"+star+"</button>";
      html+="</div>";
    });
    html+="</div></div>";
  });
  res.innerHTML=html;
}
var dbt;
function doSearch(val){
  clearTimeout(dbt);
  var q=val.trim();
  var cb=document.getElementById("cb");
  cb.style.display=q.length>0?"block":"none";
  dbt=setTimeout(function(){
    if(q.length>=3){hist=[q].concat(hist.filter(function(h){return h!==q;})).slice(0,10);sh();renderHist();}
    render(q,activeFamily);
  },200);
}
document.getElementById("si").addEventListener("input",function(e){doSearch(e.target.value);});
document.getElementById("cb").onclick=function(){document.getElementById("si").value="";this.style.display="none";render("",activeFamily);};
document.getElementById("favbtn").onclick=function(){document.getElementById("fp").classList.toggle("open");renderFavPanel();};
document.getElementById("fpc").onclick=function(){document.getElementById("fp").classList.remove("open");};
var allFamilies=[...new Set(DATA.map(function(d){return d.familia;}))].sort();
buildChips(allFamilies);renderHist();render("","");
</script>
</body></html>
