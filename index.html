<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0f0f1a;color:#e0e0f0;min-height:100vh}
header{background:linear-gradient(135deg,#1a1a3e,#2d2d6b);padding:16px 20px;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,.5)}
.logo{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.logo-icon{width:40px;height:40px;background:linear-gradient(135deg,#f5a623,#e8842a);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
h1{font-size:1.25rem;font-weight:700;color:#fff}
.subtitle{font-size:.7rem;color:#9090c0}
.search-wrap{position:relative}
#searchInput{width:100%;padding:12px 48px 12px 16px;border-radius:12px;border:2px solid #3a3a6a;background:#1e1e40;color:#e0e0f0;font-size:1rem;outline:none;transition:border-color .2s}
#searchInput:focus{border-color:#f5a623}
#searchInput::placeholder{color:#6060a0}
.clear-btn{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:#9090c0;cursor:pointer;font-size:1.1rem;display:none;padding:4px}
.clear-btn.visible{display:block}
#chips{display:flex;gap:8px;overflow-x:auto;padding:12px 20px 4px;scrollbar-width:none}
#chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;padding:6px 14px;border-radius:20px;border:1.5px solid #3a3a6a;background:#1e1e40;color:#9090c0;font-size:.78rem;cursor:pointer;transition:all .2s;white-space:nowrap}
.chip.active{background:#f5a623;border-color:#f5a623;color:#1a1a2e;font-weight:600}
#historyBar{padding:4px 20px 8px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;min-height:36px}
#historyBar::-webkit-scrollbar{display:none}
.hist-chip{flex-shrink:0;padding:4px 12px;border-radius:14px;background:#252545;border:1px solid #3a3a5a;color:#8080b0;font-size:.75rem;cursor:pointer}
.hist-chip:hover{background:#2d2d5d}
main{padding:12px 20px 100px}
.info-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-size:.8rem;color:#6060a0}
.result-count{color:#f5a623;font-weight:600}
.familia-block{margin-bottom:16px;border-radius:12px;overflow:hidden;border:1px solid #2a2a50}
.familia-header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:#1a1a3a;cursor:pointer;user-select:none}
.familia-name{font-size:.88rem;font-weight:600;color:#c0c0e8}
.familia-count{font-size:.75rem;color:#f5a623;background:#2a2040;padding:2px 8px;border-radius:10px}
.familia-arrow{color:#6060a0;font-size:.8rem;transition:transform .2s}
.familia-block.open .familia-arrow{transform:rotate(180deg)}
.familia-body{display:none}
.familia-block.open .familia-body{display:block}
.item{display:grid;grid-template-columns:1fr auto;gap:8px;padding:12px 16px;border-top:1px solid #1e1e3a;align-items:start}
.item:hover{background:#1a1a35}
.item-ref{font-family:'Courier New',monospace;font-size:.85rem;font-weight:700;color:#f5a623;word-break:break-all}
.item-desc{font-size:.82rem;color:#c0c0d8;margin-top:4px;line-height:1.4}
.item-stock{font-size:.75rem;padding:2px 8px;border-radius:8px;white-space:nowrap;margin-top:4px;display:inline-block}
.stock-ok{background:#1a3a2a;color:#4caf80;border:1px solid #2a5a3a}
.stock-zero{background:#2a2030;color:#8070a0;border:1px solid #3a2a50}
.actions{display:flex;gap:6px;margin-top:6px}
.btn-copy,.btn-wa{padding:4px 10px;border-radius:6px;font-size:.72rem;border:none;cursor:pointer}
.btn-copy{background:#2a2a5a;color:#9090d0}
.btn-wa{background:#1a4a2a;color:#4caf80}
.btn-fav{background:none;border:none;cursor:pointer;font-size:1.1rem;padding:2px}
mark{background:#f5a62333;color:#f5d080;border-radius:3px;padding:0 2px}
.empty{text-align:center;padding:60px 20px;color:#5050a0}
.empty-icon{font-size:3rem;margin-bottom:12px}
.hint{font-size:.8rem;color:#4040a0;margin-top:6px}
.fab{position:fixed;bottom:24px;right:20px;z-index:200}
.fab-btn{width:52px;height:52px;border-radius:50%;border:none;cursor:pointer;font-size:1.3rem;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(0,0,0,.4)}
.fab-fav{background:linear-gradient(135deg,#f5a623,#e8842a);color:#fff}
.fav-panel{position:fixed;bottom:0;left:0;right:0;background:#12122a;border-top:2px solid #2a2a5a;padding:20px;max-height:60vh;overflow-y:auto;display:none;z-index:300}
.fav-panel.open{display:block}
.fav-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.fav-title{font-weight:700;color:#f5a623}
.fav-close{background:none;border:none;color:#9090c0;cursor:pointer;font-size:1.2rem}
.toast{position:fixed;top:80px;left:50%;transform:translateX(-50%);background:#2a4a2a;color:#4caf80;padding:8px 20px;border-radius:20px;font-size:.85rem;display:none;z-index:400;border:1px solid #3a6a3a}
.toast.show{display:block}
.update-badge{font-size:.65rem;color:#6060a0}
</style>
</head>

let favorites=[],history2=[];
try{favorites=JSON.parse(localStorage.getItem('crFavs')||'[]');}catch(_){}
try{history2=JSON.parse(localStorage.getItem('crHist')||'[]');}catch(_){}
function saveFavs(){try{localStorage.setItem('crFavs',JSON.stringify(favorites));}catch(_){}}
function saveHist(){try{localStorage.setItem('crHist',JSON.stringify(history2));}catch(_){}}
function isFav(ref){return favorites.some(f=>f.ref===ref);}
function toggleFav(ref,desc){if(isFav(ref)){favorites=favorites.filter(f=>f.ref!==ref);}else{favorites.push({ref,desc});}saveFavs();render(currentQuery,activeFamily);renderFavPanel();}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800);}
function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function highlight(text,query){if(!query)return esc(text);const e=query.replace(/[.*+?^${}()|[]\\]/g,'\\$&');return esc(text).replace(new RegExp('('+e+')','gi'),'<mark>$1</mark>');}
let activeFamily='';
function buildChips(families){const el=document.getElementById('chips');el.innerHTML='';const all=document.createElement('button');all.className='chip'+(activeFamily===''?' active':'');all.textContent='Todas';all.onclick=()=>{activeFamily='';buildChips(families);render(currentQuery,'');};el.appendChild(all);families.forEach(f=>{const btn=document.createElement('button');btn.className='chip'+(activeFamily===f?' active':'');btn.textContent=f;btn.onclick=()=>{activeFamily=f;buildChips(families);render(currentQuery,f);};el.appendChild(btn);});}
function renderHistory(){const bar=document.getElementById('historyBar');bar.innerHTML='';history2.slice(0,10).forEach(q=>{const btn=document.createElement('button');btn.className='hist-chip';btn.textContent=q;btn.onclick=()=>{document.getElementById('searchInput').value=q;handleSearch(q);};bar.appendChild(btn);});}
function itemHTML(item,query){const fav=isFav(item.ref);const stock=parseFloat(item.stock);const stockBadge=item.stock?'<span class="item-stock '+(stock>0?'stock-ok':'stock-zero')+'">Stock: '+esc(item.stock)+'</span>':'';return '<div class="item"><div><div class="item-ref">'+highlight(item.ref,query)+'</div><div class="item-desc">'+highlight(item.desc,query)+'</div>'+stockBadge+'<div class="actions"><button class="btn-copy" onclick="copyRef(''+item.ref.replace(/'/g,"\'")+'')" >📋 Copiar</button><button class="btn-wa" onclick="shareWA(''+item.ref.replace(/'/g,"\'")+'',''+item.desc.replace(/'/g,"\'").replace(/"/g,'\"')+'')" >🟢 WhatsApp</button></div></div><button class="btn-fav" onclick="toggleFav(''+item.ref.replace(/'/g,"\'")+'',''+item.desc.replace(/'/g,"\'").replace(/"/g,'\"')+'')" >'+(fav?'⭐':'☆')+'</button></div>';}
let currentQuery='';
function render(query,family){currentQuery=query;const q=query.trim().toLowerCase();const MIN=3;const res=document.getElementById('results');const info=document.getElementById('resultInfo');if(q.length>0&&q.length<MIN){res.innerHTML='<div class="empty"><div class="empty-icon">🔍</div><div>Escribe al menos '+MIN+' caracteres</div></div>';info.textContent='';return;}let items=DATA;if(q){items=items.filter(d=>d.ref.toLowerCase().includes(q)||d.desc.toLowerCase().includes(q));}if(family){items=items.filter(d=>d.familia===family);}if(items.length===0){res.innerHTML='<div class="empty"><div class="empty-icon">🤷</div><div>Sin resultados</div><div class="hint">Prueba con otra referencia o descripción</div></div>';info.textContent='Sin resultados';return;}const groups={};items.forEach(d=>{if(!groups[d.familia])groups[d.familia]=[];groups[d.familia].push(d);});const familyKeys=Object.keys(groups).sort();info.textContent=items.length+' resultado'+(items.length!==1?'s':'');res.innerHTML=familyKeys.map(fam=>{const list=groups[fam];return '<div class="familia-block open"><div class="familia-header" onclick="this.parentElement.classList.toggle('open')"><span class="familia-name">'+esc(fam)+'</span><span><span class="familia-count">'+list.length+'</span><span class="familia-arrow">▼</span></span></div><div class="familia-body">'+list.map(i=>itemHTML(i,q.length>=MIN?query.trim():'')).join('')+'</div></div>';}).join('');}
function copyRef(ref){navigator.clipboard.writeText(ref).then(()=>toast('✅ Copiado: '+ref)).catch(()=>toast('❌ Error al copiar'));}
function shareWA(ref,desc){const msg='🔧 *Carrio Repuestos*%0ARef: '+encodeURIComponent(ref)+'%0A'+encodeURIComponent(desc);window.open('https://api.whatsapp.com/send?text='+msg,'_blank');}
function renderFavPanel(){const list=document.getElementById('favList');if(favorites.length===0){list.innerHTML='<div class="empty" style="padding:20px 0"><div class="empty-icon">☆</div><div>Sin favoritos</div></div>';return;}list.innerHTML=favorites.map(f=>'<div class="item"><div><div class="item-ref">'+esc(f.ref)+'</div><div class="item-desc">'+esc(f.desc)+'</div><div class="actions"><button class="btn-copy" onclick="copyRef(''+f.ref.replace(/'/g,"\'")+'')">📋 Copiar</button></div></div><button class="btn-fav" onclick="toggleFav(''+f.ref.replace(/'/g,"\'")+'',''+f.desc.replace(/'/g,"\'")+'')" >⭐</button></div>').join('');}
document.getElementById('favBtn').onclick=()=>{document.getElementById('favPanel').classList.toggle('open');renderFavPanel();};
document.getElementById('favClose').onclick=()=>{document.getElementById('favPanel').classList.remove('open');};
let debounce;
function handleSearch(val){clearTimeout(debounce);const q=val.trim();document.getElementById('clearBtn').classList.toggle('visible',q.length>0);debounce=setTimeout(()=>{if(q.length>=3){history2=[q,...history2.filter(h=>h!==q)].slice(0,10);saveHist();renderHistory();}render(q,activeFamily);},200);}
document.getElementById('searchInput').addEventListener('input',e=>handleSearch(e.target.value));
document.getElementById('clearBtn').onclick=()=>{document.getElementById('searchInput').value='';document.getElementById('clearBtn').classList.remove('visible');render('',activeFamily);};
const allFamilies=[...new Set(DATA.map(d=>d.familia))].sort();
buildChips(allFamilies);renderHistory();render('','');
